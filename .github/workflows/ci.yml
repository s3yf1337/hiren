name: CI

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build, test, headless smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install headless test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libxkbcommon0 libxkbcommon-x11-0

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        run: cargo test --workspace

      - name: Build client with layer-shell
        run: cargo build -p hiren-client --features layer-shell

      # Warnings are reported but do not fail CI yet; -D warnings comes later.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Validate bundled themes
        run: xvfb-run -a ./target/debug/hiren-client --validate-themes

      - name: Screenshot smoke test
        run: xvfb-run -a timeout 15 ./target/debug/hiren-client --screenshot default --out /tmp/ci.png

      - name: Daemon and client IPC smoke test
        env:
          HIREN_SOCKET_PATH: ${{ runner.temp }}/hiren.sock
        run: |
          set -euo pipefail
          ./target/debug/hiren-daemon &
          DAEMON_PID=$!
          trap 'kill "$DAEMON_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            [ -S "$HIREN_SOCKET_PATH" ] && break
            sleep 0.1
          done
          test -S "$HIREN_SOCKET_PATH"
          xvfb-run -a ./target/debug/hiren-client --screenshot default --query fire --out /tmp/ipc.png
          test -s /tmp/ipc.png
          kill "$DAEMON_PID"
          wait "$DAEMON_PID" 2>/dev/null || true
          trap - EXIT
