# ---------------------------------------------------------------------
# Row delegate — the P5 save-list row.
# Plate stack (violet under cyan) pops in behind the red slab; the white
# bar carries a black No-tag chip, red hero numeral, black Antonio name.
# y spring = scroll transition; scale spring = selection pop. Targets are
# state-driven (no time), so springs settle and idle cost stays zero.
# ---------------------------------------------------------------------
[components.p5_row]
  [[components.p5_row.animate]]
  property = "opacity"
  from = 0
  duration_ms = 180
  delay = "index * 22"
  easing = "ease_out_quad"

  [[components.p5_row.animate]]
  property = "x"
  from = -70
  duration_ms = 260
  delay = "index * 22"
  easing = "ease_out_expo"

  [[components.p5_row.animate]]
  property = "y"
  duration_ms = 240
  easing = "spring"
  spring = { stiffness = 480, damping = 26, mass = 1 }

  [[components.p5_row.animate]]
  property = "scale"
  duration_ms = 200
  easing = "spring"
  spring = { stiffness = 420, damping = 24, mass = 1 }

  # Violet plate — bottom of the selection stack
  [[components.p5_row.nodes]]
  id = "plate_violet"
  type = "Rectangle"
  x = "18"
  y = "13"
  width = "552"
  height = "46"
  skew = "-18"
  visible = "is_selected"
  props = { background = "#7B4CE0" }

  # Cyan plate — middle of the stack
  [[components.p5_row.nodes]]
  id = "plate_cyan"
  type = "Rectangle"
  x = "9"
  y = "6"
  width = "552"
  height = "46"
  skew = "-18"
  visible = "is_selected"
  props = { background = "#29ABE2" }

  # The bar itself — white, or the red slab when selected
  [[components.p5_row.nodes]]
  id = "row_bar"
  type = "Rectangle"
  x = "0"
  y = "0"
  width = "552"
  height = "46"
  skew = "-18"
  scale = "is_selected ? 1.05 : 1.0"
  props = { background = "is_selected ? #E60012 : #FFFFFF", border = "is_selected ? '0px #000000' : '3px #000000'" }
  on_click = "activate(index)"

  # Film perforation — black sprockets down the red slab's left edge
  [[components.p5_row.nodes]]
  id = "perf_a"
  type = "Rectangle"
  x = "12"
  y = "7"
  width = "7"
  height = "7"
  visible = "is_selected"
  props = { background = "#000000" }

  [[components.p5_row.nodes]]
  id = "perf_b"
  type = "Rectangle"
  x = "12"
  y = "20"
  width = "7"
  height = "7"
  visible = "is_selected"
  props = { background = "#000000" }

  [[components.p5_row.nodes]]
  id = "perf_c"
  type = "Rectangle"
  x = "12"
  y = "33"
  width = "7"
  height = "7"
  visible = "is_selected"
  props = { background = "#000000" }

  # Star sparkle at the bar's end
  [[components.p5_row.nodes]]
  id = "row_star"
  type = "Polygon"
  x = "524"
  y = "15"
  width = "16"
  height = "16"
  rotation = "time * 55"
  visible = "is_selected"
  points = "8,0; 10,6; 16,8; 10,10; 8,16; 6,10; 0,8; 6,6"
  props = { background = "#FFFFFF" }

  # No-tag — black chip hanging off the left edge (P5's "No.3")
