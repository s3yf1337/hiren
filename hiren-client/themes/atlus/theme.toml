# Hiren — ATLAS
# Editorial game menu. Primary: Metaphor: ReFantazio. Motion: Persona 5.
# Cream overlaps navy in the middle (no gutter). Outer corners are cut; dossier stays in frame.
# Not a GTK list. Not black+red+white+diagonals. Not a centered card.

[meta]
name = "atlus"
description = "Metaphor-inspired archive menu — cream manuscript, navy void, independent selector, compositional selection"
author = "hiren"

[window]
width = 1080
height = 640
transparent = true
time_hz = 60

# =====================================================================
# Layer 0 — navy field (right). Overlaps cream. Recedes from the window TR/BR.
# =====================================================================
[[nodes]]
id = "navy_field"
type = "Polygon"
x = "0 + shake(4, 2) + launcher.launching * 90"
y = "0 + min(launcher.selected_index, 10) * 1.5"
width = "window.width"
height = "window.height"
points = "410, 12; 968, 36; 1048, 110; 1056, 490; 992, 568; 430, 596; 396, 96"
props = { background = "#0E1728" }
z = 0
opacity = "launcher.launching ? 0 : 1"
animate = [
  { property = "x", from = "window.width * 0.22", duration_ms = 520, easing = "ease_out_expo" },
  { property = "opacity", from = 0, duration_ms = 280, easing = "ease_out_quad" },
  { property = "y", duration_ms = 640, easing = "spring", spring = { stiffness = 140, damping = 22, mass = 1 } },
]

[[nodes]]
id = "hatches"
type = "Repeater"
x = "0"
y = "0"
delegate = "hatch"
z = 1
props = { count = "8", layout = "free" }

# =====================================================================
# Layer 1 — cream manuscript (left). Overlaps navy. Tab + bottom-left bite.
# =====================================================================
[[nodes]]
id = "cream_shadow"
type = "Polygon"
x = "-12 + shake(5, 1) - launcher.launching * 160"
y = "14"
width = "window.width"
height = "window.height"
points = "26, 12; 292, 2; 318, 56; 628, 32; 652, 568; 96, 608; 20, 68"
props = { background = "#C9B48A" }
z = 2
opacity = "launcher.launching ? 0 : 1"
animate = [
  { property = "x", from = -260, duration_ms = 480, delay = 30, easing = "ease_out_expo" },
]

[[nodes]]
