id = "red_band_deep"
type = "Rectangle"
x = "-160 + sin(time * 0.31 + 1.7) * 20"
y = "-96 + cos(time * 0.36 + 0.9) * 10"
width = "1240"
height = "204"
rotation = "-10.6 + sin(time * 0.42 + 2.1) * 1.1"
props = { background = "#BA0000" }

# Red field — the signature diagonal mass across the top (breathing).
# Drift lives on y/rotation (never animated) so springs can't chase it.
