# ATLAS — Persona 5 / Atlus "Pop Punk" design language
# -----------------------------------------------------
# Grounded in Atlus's own CEDEC 2017 UI talk and pixel measurements of
# official P5 screens (see docs/CLIENT_ARCHITECTURE.md):
#   - ~60% true-black ground, red as LARGE FLAT FIELDS (~20%), white only
#     for type and lines (~4%). No gradients, no glows, no drop shadows.
#   - One diagonal system (-12°) for every decorative shape; content
#     itself stays straight (loud display, quiet body).
#   - Cyan (#40E0E8) is reserved for the selection marker, yellow
#     (#FFD800) for numbers — never used anywhere else.
#   - Jagged stepped edges, cut corners, sticker tabs — no plain
#     rectangles anywhere; hero-scale numerals (2-4x the label size).
#   - CONSTANT ambient motion like the game: the diagonal masses breathe,
#     the gaze line drifts, halftone dots shimmer, sparks float along the
#     base, the selection shivers. `time`-driven — the runtime paces this
#     at ~22 fps so an idle launcher still costs almost nothing.
#   - Fast input feedback (<=0.15s springs) on top of the ambient drift.
# Scroll geometry: rows are 56px + 10 gap (stride 66), viewport clips at
# y=128; the selector/deco divide the same scroll offset as the list.

[meta]
name = "atlus"
description = "Persona 5 Pop Punk — flat red fields on true black, breathing diagonals, constant ambient motion, cyan selection slash, hero numerals"
author = "hiren"

[window]
width = 840
height = 520
transparent = true

# Ground — true black, sharp corners
[[nodes]]
id = "bg"
type = "Rectangle"
x = "0"
y = "0"
width = "window.width"
height = "window.height"
props = { background = "#0C0C0D" }

# Deep parallax — a barely-there diagonal band drifting across the ground
[[nodes]]
id = "bg_slash"
type = "Rectangle"
x = "-200 + sin(time * 0.16) * 80"
y = "290"
width = "1800"
height = "130"
rotation = "-12"
opacity = "0.035"
props = { background = "#FFFFFF" }

# Deep red underlayer — the parallax echo behind the main field
