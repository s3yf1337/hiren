# ---------------------------------------------------------------------------
# Row delegate — quiet body, loud (and alive) selection.
# The y spring is the scroll transition: the viewport band jumps, instances
# glide to their new rows. Targets are static between scrolls, so springs
# settle and the loop stays idle.
# ---------------------------------------------------------------------------
[components.atlus_row]
  [[components.atlus_row.animate]]
  property = "opacity"
  from = 0
  duration_ms = 200
  delay = "index * 24"
  easing = "ease_out_quad"

  [[components.atlus_row.animate]]
  property = "x"
  from = -56
  duration_ms = 260
  delay = "index * 24"
  easing = "ease_out_expo"

  [[components.atlus_row.animate]]
  property = "y"
  duration_ms = 240
  easing = "spring"
  spring = { stiffness = 480, damping = 26, mass = 1 }

  [[components.atlus_row.nodes]]
  id = "row_bg"
  type = "Rectangle"
  x = "0"
  y = "0"
  width = "520"
  height = "56"
  scale = "is_selected ? 1.045 : 1.0"
  rotation = "is_selected ? sin(time * 3.3) * 0.8 : 0"
  props = { background = "is_selected ? #DE0000 : transparent" }
  animate = [{ property = "scale", duration_ms = 140, easing = "spring", spring = { stiffness = 520, damping = 26, mass = 1 } }]
  on_click = "activate(index)"

  [[components.atlus_row.nodes]]
  id = "row_index"
  type = "Text"
  x = "6"
  y = "2"
  width = "62"
  height = "52"
  text = "index"
  scale = "is_selected ? 1 + 0.05 * sin(time * 4.6 + 0.5) : 1.0"
  props = { color = "is_selected ? #FFD800 : #4E4E52", font_size = "is_selected ? 34 : 24", font_weight = "900", align = "right" }

  [[components.atlus_row.nodes]]
  id = "row_name"
  type = "Text"
  x = "80"
  y = "6"
  width = "428"
  height = "28"
  text = "item_name"
  props = { color = "#FFFFFF", font_size = "is_selected ? 17 : 14", font_weight = "is_selected ? 800 : 600", align = "left" }

  [[components.atlus_row.nodes]]
  id = "row_desc"
  type = "Text"
  x = "80"
  y = "32"
  width = "428"
  height = "16"
  text = "item_description"
  visible = "item_description != ''"
  props = { color = "is_selected ? rgba(255,255,255,0.75) : #8A8A8A", font_size = "10", font_weight = "500", align = "left" }

  [[components.atlus_row.nodes]]
  id = "row_id"
  type = "Text"
  x = "80"
  y = "32"
  width = "428"
  height = "16"
  text = "item_id"
  visible = "item_description == ''"
  props = { color = "is_selected ? rgba(255,255,255,0.6) : #585858", font_size = "10", font_weight = "500", align = "left" }

# ---------------------------------------------------------------------------
# Decorative delegates
# ---------------------------------------------------------------------------
[components.wedge_step]
  # One stair of the jagged top edge: white tread on the new diagonal,
  # black riser filling down over the panel's straight border.
  [[components.wedge_step.nodes]]
  id = "tread"
  type = "Rectangle"
  x = "index * 33.6"
  y = "-2 - (index + 1) * 1.875"
  width = "35"
  height = "6"
  props = { background = "#FFFFFF" }

  [[components.wedge_step.nodes]]
  id = "riser"
  type = "Rectangle"
  x = "index * 33.6"
  y = "4 - (index + 1) * 1.875"
  width = "34"
  height = "6 + (index + 1) * 1.875"
  props = { background = "#0C0C0D" }

[components.dot_cell]
  [[components.dot_cell.nodes]]
  id = "dot"
  type = "Rectangle"
  x = "(index % 4) * 24"
  y = "floor(index / 4) * 22"
  width = "7"
  height = "7"
  rotation = "45"
  opacity = "0.3 + 0.18 * sin(time * 1.7 + index * 0.9)"
  props = { background = "#FFFFFF" }

[components.dot_cell_small]
  [[components.dot_cell_small.nodes]]
  id = "dot"
  type = "Rectangle"
  x = "index * 38"
  y = "0"
  width = "5"
  height = "5"
  rotation = "45"
  opacity = "0.14 + 0.1 * sin(time * 1.4 + index * 1.1)"
  props = { background = "#FFFFFF" }

[components.spark]
  [[components.spark.nodes]]
  id = "spark_dot"
  type = "Rectangle"
  x = "60 + index * 132 + sin(time * 0.35 + index * 2.1) * 26"
  y = "468 + cos(time * 0.4 + index * 1.7) * 7"
  width = "6"
  height = "6"
  rotation = "45 + sin(time * 0.8 + index) * 20"
  opacity = "0.1 + 0.08 * sin(time * 1.1 + index * 0.7)"
  props = { background = "#FFFFFF" }
