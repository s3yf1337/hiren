x = "-90"
y = "-142 + cos(time * 0.47) * 8"
width = "1120"
height = "234"
rotation = "-12 + sin(time * 0.55) * 1.4"
props = { background = "#DE0000" }
animate = [{ property = "opacity", from = 0, duration_ms = 220, easing = "ease_out_quad" }]

