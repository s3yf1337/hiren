# ---------------------------------------------------------------------
# Row delegate — the settings row.
# Cascade: every node shifts LEFT by 5px per visible row, so the list
# marches down-left and scrolling glides on the diagonal. The x spring
# chases the cascade target on every selection change.
# ---------------------------------------------------------------------
[components.p5_row]
  [[components.p5_row.animate]]
  property = "opacity"
  from = 0
  duration_ms = 180
  delay = "index * 22"
  easing = "ease_out_quad"

  [[components.p5_row.animate]]
  property = "x"
  from = -90
  duration_ms = 300
  delay = "index * 22"
  easing = "spring"
  spring = { stiffness = 380, damping = 20, mass = 1 }

  [[components.p5_row.animate]]
  property = "y"
  duration_ms = 240
  easing = "spring"
  spring = { stiffness = 480, damping = 26, mass = 1 }

  [[components.p5_row.animate]]
  property = "scale"
  duration_ms = 220
  easing = "spring"
  spring = { stiffness = 420, damping = 20, mass = 1 }

  # Violet + cyan plates — the title-menu stack (selected only)
  [[components.p5_row.nodes]]
  id = "plate_violet"
  type = "Rectangle"
  x = "18 - (index - clamp(launcher.selected_index - 3, 0, launcher.results_count)) * 5"
  y = "12"
  width = "540"
  height = "44"
  skew = "-16"
  visible = "is_selected"
  props = { background = "#7B4CE0" }

  [[components.p5_row.nodes]]
  id = "plate_cyan"
  type = "Rectangle"
  x = "9 - (index - clamp(launcher.selected_index - 3, 0, launcher.results_count)) * 5"
  y = "6"
  width = "540"
  height = "44"
  skew = "-16"
  visible = "is_selected"
  props = { background = "#29ABE2" }

  # The bar — white, or the red slab when selected; independent wobble
  [[components.p5_row.nodes]]
  id = "row_bar"
  type = "Rectangle"
  x = "0 - (index - clamp(launcher.selected_index - 3, 0, launcher.results_count)) * 5"
  y = "0"
  width = "540"
  height = "44"
  skew = "-16"
  rotation = "sin(time * 0.55 + index * 1.3) * 0.45"
  scale = "is_selected ? 1.05 : 1.0"
  props = { background = "is_selected ? #E60012 : #FFFFFF", border = "is_selected ? '0px #000000' : '3px #000000'" }
  on_click = "activate(index)"

  # Film perforation — black sprockets on the red slab
  [[components.p5_row.nodes]]
  id = "perf_a"
  type = "Rectangle"
  x = "14 - (index - clamp(launcher.selected_index - 3, 0, launcher.results_count)) * 5"
  y = "7"
  width = "7"
  height = "7"
  visible = "is_selected"
  props = { background = "#000000" }

  [[components.p5_row.nodes]]
  id = "perf_b"
  type = "Rectangle"
  x = "14 - (index - clamp(launcher.selected_index - 3, 0, launcher.results_count)) * 5"
  y = "19"
  width = "7"
  height = "7"
  visible = "is_selected"
  props = { background = "#000000" }

  [[components.p5_row.nodes]]
  id = "perf_c"
  type = "Rectangle"
  x = "14 - (index - clamp(launcher.selected_index - 3, 0, launcher.results_count)) * 5"
  y = "31"
  width = "7"
  height = "7"
  visible = "is_selected"
  props = { background = "#000000" }

  # Mode tab — juts past the bar's right edge at varying depth
  [[components.p5_row.nodes]]
  id = "mode_tab"
  type = "Rectangle"
  x = "516 + (index - floor(index / 3) * 3) * 12 - (index - clamp(launcher.selected_index - 3, 0, launcher.results_count)) * 5"
  y = "8"
  width = "66"
  height = "28"
  skew = "-16"
  props = { background = "is_selected ? #FFFFFF : #000000", border = "is_selected ? '0px #000000' : '2px #FFFFFF'" }

  [[components.p5_row.nodes]]
  id = "mode_tab_text"
  type = "Text"
  x = "516 + (index - floor(index / 3) * 3) * 12 - (index - clamp(launcher.selected_index - 3, 0, launcher.results_count)) * 5"
  y = "8"
  width = "66"
  height = "28"
  text = "item_mode == 'calc' ? 'CALC' : item_mode == 'run' ? 'CMD' : item_mode == 'window' ? 'WIN' : 'APP'"
  props = { color = "is_selected ? #000000 : #FFFFFF", font_size = "14", font_weight = "700", font_family = "Antonio", align = "center" }

  # No-tag — black chip hanging off the left edge
  [[components.p5_row.nodes]]
  id = "no_chip"
  type = "Rectangle"
  x = "-46 - (index - clamp(launcher.selected_index - 3, 0, launcher.results_count)) * 5"
  y = "13"
  width = "48"
  height = "22"
  skew = "-16"
  props = { background = "#000000", border = "2px #FFFFFF" }

  [[components.p5_row.nodes]]
  id = "no_label"
  type = "Text"
  x = "-42 - (index - clamp(launcher.selected_index - 3, 0, launcher.results_count)) * 5"
  y = "13"
  width = "20"
  height = "22"
  text = "No."
  props = { color = "rgba(255,255,255,0.75)", font_size = "9", font_weight = "400", font_family = "Antonio", align = "left" }

  [[components.p5_row.nodes]]
  id = "no_num"
  type = "Text"
  x = "-24 - (index - clamp(launcher.selected_index - 3, 0, launcher.results_count)) * 5"
  y = "13"
  width = "24"
  height = "22"
  text = "index"
  props = { color = "#FFFFFF", font_size = "13", font_weight = "700", font_family = "Antonio", align = "right" }

  # Red hero numeral (white on the selected slab)
  [[components.p5_row.nodes]]
  id = "row_index"
  type = "Text"
  x = "34 - (index - clamp(launcher.selected_index - 3, 0, launcher.results_count)) * 5"
  y = "0"
  width = "52"
  height = "44"
  text = "index"
  props = { color = "is_selected ? #FFFFFF : #E60012", font_size = "is_selected ? 27 : 23", font_weight = "700", font_family = "Antonio", align = "right" }

  # Name — caps Antonio, black on white / white on red
  [[components.p5_row.nodes]]
  id = "row_name"
  type = "Text"
  x = "96 - (index - clamp(launcher.selected_index - 3, 0, launcher.results_count)) * 5"
  y = "3"
  width = "404"
  height = "24"
  text = "item_name"
  text_case = "upper"
  props = { color = "is_selected ? #FFFFFF : #000000", font_size = "is_selected ? 18 : 16", font_weight = "700", font_family = "Antonio", align = "left" }

  # Description — quiet serif line
  [[components.p5_row.nodes]]
  id = "row_desc"
  type = "Text"
  x = "97 - (index - clamp(launcher.selected_index - 3, 0, launcher.results_count)) * 5"
  y = "26"
  width = "404"
  height = "15"
  text = "item_description"
  visible = "item_description != ''"
  props = { color = "is_selected ? rgba(255,255,255,0.78) : #5A5A5E", font_size = "10", font_weight = "400", font_family = "DejaVu Serif", align = "left" }

  # Fallback: exec id when there is no description
  [[components.p5_row.nodes]]
  id = "row_id"
  type = "Text"
  x = "97 - (index - clamp(launcher.selected_index - 3, 0, launcher.results_count)) * 5"
  y = "26"
  width = "404"
  height = "15"
  text = "item_id"
  visible = "item_description == ''"
  props = { color = "is_selected ? rgba(255,255,255,0.6) : #8A8A8E", font_size = "10", font_weight = "400", align = "left" }

# ---------------------------------------------------------------------
# Decorative delegates
# ---------------------------------------------------------------------
[components.perf_hole]
  [[components.perf_hole.nodes]]
  id = "hole"
  type = "Rectangle"
  x = "0"
  y = "index * 26 + time * 16 - floor((index * 26 + time * 16) / 164) * 164"
  width = "10"
  height = "10"
  rotation = "-12"
  opacity = "0.65"
  props = { background = "#FFFFFF" }

[components.star_cell]
  [[components.star_cell.nodes]]
  id = "star"
  type = "Polygon"
  x = "(index - floor(index / 3) * 3) * 42 + 6"
  y = "floor(index / 3) * 40 + 8"
  width = "16"
  height = "16"
  rotation = "time * 30 + index * 40"
  opacity = "0.35 + 0.3 * sin(time * 1.6 + index * 0.9)"
  points = "8,0; 10.2,5.8; 16,8; 10.2,10.2; 8,16; 5.8,10.2; 0,8; 5.8,5.8"
  props = { background = "#FFFFFF" }
