  id = "no_chip"
  type = "Rectangle"
  x = "-46"
  y = "14"
  width = "48"
  height = "22"
  skew = "-18"
  props = { background = "#000000", border = "2px #FFFFFF" }

  [[components.p5_row.nodes]]
  id = "no_label"
  type = "Text"
  x = "-42"
