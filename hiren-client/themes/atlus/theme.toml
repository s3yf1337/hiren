# ATLAS — Persona 5 UI, full collage
# ---------------------------------------------------------------
# The window is transparent; the UI is a TORN SPLASH, not a rectangle:
#   * the black ground is a jagged polygon bleeding off three edges, torn
#     V-notches open to the desktop at the top-right and bottom-left
#   * a white torn band crosses the bottom (the settings "OK" band), the
#     footer lives on it in black type with oscillating dashes
#   * the red mass bursts off the top-left; a detached shard + star plate
#     float in the top-right notch
# List = the settings screen: skewed white bars in a DIAGONAL CASCADE
# (each row steps left as it goes down; scrolling glides diagonally),
# ragged right edge from APP/CMD/CALC mode tabs jutted at varying depths,
# black No-tags hanging off the left, red Antonio numerals, serif body.
# Selected = red slab on the cyan/violet plate stack (title-menu stack),
# film perforation, white star, on/off-style white mode tab.
# Motion everywhere: bars wobble independently, the film perforation
# MARCHES, dashes slide, red breathes, stars spin, bg slashes drift,
# springs overshoot (damping 20-26). Time lives only on non-animated
# props; springs chase state-driven targets and settle.
# Scroll geometry: rows 44px + 14 gap (stride 58), viewport clips at
# y=190, cascade divides the same scroll offset as the list.

[meta]
name = "atlus"
description = "Persona 5 collage — torn splash silhouette, cascade list with mode tabs, plate-stack selection, marching film, ransom-note Antonio"
author = "hiren"

[window]
width = 900
height = 600
transparent = true

