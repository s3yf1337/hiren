height = "64"
rotation = "-4"
text = "NO RECORD"
props = { color = "#F4E4C1", font_size = "28", font_family = "Oswald", font_weight = "700", align = "center" }
z = 11
visible = "launcher.results_count == 0 && launcher.query != ''"
opacity = "launcher.launching ? 0 : 1"

# =====================================================================
# Layer 7 — footer
# =====================================================================
[[nodes]]
id = "footer"
type = "Text"
x = "110"
y = "568"
width = "400"
height = "18"
text = "MOVE    OPEN    ESC CLOSE"
props = { color = "rgba(26,18,8,0.45)", font_size = "10", font_family = "Oswald", font_weight = "700", align = "left" }
z = 12
opacity = "launcher.launching ? 0 : 1"
animate = [{ property = "opacity", from = 0, duration_ms = 300, delay = 360, easing = "ease_out_quad" }]

# =====================================================================
# Components
# =====================================================================
[components.hatch]
  [[components.hatch.nodes]]
  id = "hatch_line"
  type = "Rectangle"
  x = "window.width * 0.42 + index * 22 + min(launcher.selected_index, 12) * 4"
  y = "index * 86 - 50"
  width = "540"
  height = "3"
  rotation = "-26"
  props = { background = "rgba(244,228,193,0.045)" }
  z = 1
  animate = [{ property = "x", duration_ms = 640, easing = "spring", spring = { stiffness = 80, damping = 20, mass = 1 } }]

[components.archive_row]
  [[components.archive_row.animate]]
  property = "x"
  from = -110
  duration_ms = 520
  delay = "index * 36"
  easing = "spring"
  spring = { stiffness = 170, damping = 20, mass = 1 }

  [[components.archive_row.nodes]]
  id = "row_hit"
  type = "Rectangle"
  x = "is_selected * 28"
  y = "0"
  width = "500"
  height = "52"
  props = { background = "transparent" }
  on_click = "activate(index)"
  z = 9
  animate = [{ property = "x", duration_ms = 420, easing = "spring", spring = { stiffness = 200, damping = 18, mass = 1 } }]

  [[components.archive_row.nodes]]
  id = "row_idx"
  type = "Text"
  x = "is_selected * 28"
  y = "8"
  width = "36"
  height = "36"
  text = "index + 1"
  props = { color = "is_selected ? #F4E4C1 : rgba(26,18,8,0.38)", font_size = "is_selected ? 16 : 12", font_family = "Oswald", font_weight = "700", align = "left" }
  z = 10
  opacity = "is_selected ? 1 : 0.7"
  animate = [{ property = "x", duration_ms = 420, easing = "spring", spring = { stiffness = 200, damping = 18, mass = 1 } }]

  [[components.archive_row.nodes]]
  id = "row_icon_plate"
  type = "Polygon"
  x = "28 + is_selected * 28"
  y = "8"
  width = "36"
  height = "36"
  rotation = "is_selected ? -8 : -3"
  points = "4, 0; 36, 4; 32, 36; 0, 32"
  props = { background = "is_selected ? #1A1208 : #E6D0A4" }
  z = 10
  scale = "is_selected ? 1.12 : 1"
  animate = [
    { property = "x", duration_ms = 420, easing = "spring", spring = { stiffness = 200, damping = 18, mass = 1 } },
    { property = "scale", duration_ms = 380, easing = "spring", spring = { stiffness = 260, damping = 16, mass = 1 } },
    { property = "rotation", duration_ms = 380, easing = "spring", spring = { stiffness = 240, damping = 16, mass = 1 } },
  ]

  [[components.archive_row.nodes]]
  id = "row_icon"
  type = "Image"
  x = "32 + is_selected * 28"
  y = "12"
  width = "28"
  height = "28"
  props = { src = "item_icon" }
  visible = "item_icon != ''"
  z = 11
  animate = [{ property = "x", duration_ms = 420, easing = "spring", spring = { stiffness = 200, damping = 18, mass = 1 } }]

  [[components.archive_row.nodes]]
  id = "row_letter"
  type = "Text"
  x = "28 + is_selected * 28"
  y = "8"
  width = "36"
  height = "36"
  text = "initial(item_name)"
  visible = "item_icon == ''"
  props = { color = "is_selected ? #F4E4C1 : #1A1208", font_size = "16", font_family = "Oswald", font_weight = "700", align = "center" }
  z = 11
  animate = [{ property = "x", duration_ms = 420, easing = "spring", spring = { stiffness = 200, damping = 18, mass = 1 } }]

  [[components.archive_row.nodes]]
  id = "row_name"
  type = "Text"
  x = "76 + is_selected * 28"
  y = "is_selected ? 2 : 10"
  width = "400"
  height = "is_selected ? 32 : 32"
  text = "item_name"
  scale = "is_selected ? 1.06 : 1"
  props = { color = "#1A1208", font_size = "is_selected ? 22 : 16", font_family = "is_selected ? 'Playfair Display Black' : 'Oswald'", font_weight = "is_selected ? 900 : 700", align = "left" }
  z = 10
  opacity = "is_selected ? 1 : 0.62"
  animate = [
    { property = "x", duration_ms = 420, easing = "spring", spring = { stiffness = 200, damping = 18, mass = 1 } },
    { property = "scale", duration_ms = 380, easing = "spring", spring = { stiffness = 260, damping = 16, mass = 1 } },
    { property = "y", duration_ms = 320, easing = "ease_out_cubic" },
  ]

  [[components.archive_row.nodes]]
  id = "row_meta"
  type = "Text"
  x = "78 + is_selected * 28"
  y = "32"
  width = "380"
  height = "16"
  text = "item_description"
  visible = "is_selected && item_description != ''"
  props = { color = "rgba(26,18,8,0.5)", font_size = "11", font_family = "Oswald", align = "left" }
  z = 10
  animate = [{ property = "opacity", from = 0, duration_ms = 180, trigger = "select", easing = "ease_out_quad" }]
