# ATLAS — Persona 5 / Atlus "Pop Punk" design language, take two
# ---------------------------------------------------------------
# Modeled directly on P5R's Save/Load screens (GameUIDatabase #618):
#   * EVERYTHING sits on one diagonal family (-7..-12 deg). List rows are
#     SKEWED PARALLELOGRAMS (not rotated rects): `skew` leans their vertical
#     edges while `rotation` lays the band on the diagonal.
#   * Selected row = the game's selection explosion: a red slab on a stack of
#     cyan + violet offset plates (the "LoaD GAmE" title stack), film-strip
#     perforation down its left edge, a spinning star sparkle at its end.
#   * Unselected rows are white bars with black borders and black "No.N"
#     tag chips hanging off the left edge, red hero numerals, black type.
#   * Type is ransom-note: Antonio (condensed display) with thick black
#     outline + hard offset shadow on headers; DejaVu Serif for the quiet
#     serif body lines (P5 uses a serif for location/label text).
#   * Palette discipline: true black ground, ONE red (#E60012) as large flat
#     fields, white for type/bars, cyan #29ABE2 + violet #7B4CE0 ONLY in the
#     selection plate stack, yellow #FFD800 ONLY for numerals.
#   * Constant ambient motion (time bindings on NON-animated props only —
#     springs own scale/y; drift owns x/y/rotation/opacity elsewhere).
# Scroll geometry: rows 46px + 14 gap (stride 60), viewport clips at y=168,
# the No-chips and plates divide the same scroll offset as the list.

[meta]
name = "atlus"
description = "Persona 5 Save/Load geometry — skewed rows, No-tags, plate-stack selection, ransom-note Antonio type"
author = "hiren"

[window]
width = 860
height = 560
transparent = true

# Ground — true black, like the game's negative space
[[nodes]]
id = "bg"
type = "Rectangle"
x = "0"
y = "0"
width = "window.width"
height = "window.height"
props = { background = "#000000" }

