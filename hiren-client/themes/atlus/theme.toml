props = { background = "#F4E4C1" }
z = 3
opacity = "launcher.launching ? 0 : 1"
animate = [
  { property = "x", from = -240, duration_ms = 500, delay = 40, easing = "ease_out_expo" },
  { property = "opacity", from = 0, duration_ms = 260, delay = 40, easing = "ease_out_quad" },
