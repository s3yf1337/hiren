[package]
name = "hiren-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hiren-shared = { path = "../hiren-shared" }
gtk4 = { version = "0.9", features = ["v4_10"] }
glib = "0.20"
gtk4-layer-shell = "0.4"
serde = { version = "1", features = ["derive"] }
